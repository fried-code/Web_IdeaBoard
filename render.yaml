services:
  - type: web
    name: idea-board
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class eventlet -w 1 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_PATH
        value: /var/data/board.db
    disk:
      name: idea-board-disk
      mountPath: /var/data
      sizeGB: 1
